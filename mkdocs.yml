site_name: SignalForge
site_description: SignalForge architecture, engineering and generated Python API documentation

docs_dir: docs

nav:
  - Home: index.md
  - Engineering Definition of Done: engineering-definition-of-done.md
  - Python Documentation Standard: python-documentation-standard.md
  - Engineering Guides:
      - Persistence Development: persistence-development.md
      - Replay CLI: replay-cli.md
  - Strategies:
      - RSI Mean-Reversion V1 Reference: strategies/rsi-mean-reversion-v1.md
  - Validation:
      - Cross-Strategy Proof: validation/cross-strategy-proof.md
      - M7 Recovery Golden: validation/m7-recovery-golden.md
  - Architecture:
      - ADR-001 — Single-Security MVP Runtime Architecture: architecture/decisions/ADR-001-single-security-mvp-runtime-architecture.md
      - ADR-002 — Core Domain Models & State Machines: architecture/decisions/ADR-002-core-domain-models-state-machines.md
      - ADR-003 — Persistence, Recovery & Idempotency Contract: architecture/decisions/ADR-003-persistence-recovery-idempotency-contract.md
      - ADR-004 — Runtime Interfaces & Component Contracts: architecture/decisions/ADR-004-runtime-interfaces-component-contracts.md
      - ADR-005 — Market Data & Candle Contract: architecture/decisions/ADR-005-market-data-candle-contract.md
      - ADR-006 — Indicator Engine Contract: architecture/decisions/ADR-006-indicator-engine-contract.md
      - ADR-007 — Paper Execution & Fill Model: architecture/decisions/ADR-007-paper-execution-fill-model.md
      - ADR-008 — Strategy Runtime Boundary: architecture/decisions/ADR-008-strategy-runtime-boundary.md
  - API:
      - Strategy Runtime: api/strategy-runtime.md
      - Strategy Registry: api/strategy-registry.md
      - Strategy Decision Persistence: api/strategy-decision-persistence.md
      - Market-Input Recovery: api/market-input-recovery.md
      - RSI Mean-Reversion Reference: api/rsi-mean-reversion-v1.md
      - Indicators: api/indicators.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
