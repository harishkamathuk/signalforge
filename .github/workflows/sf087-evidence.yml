name: SF-087 Delta evidence probe

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  stage-b:
    if: github.head_ref == 'feat/sf087-delta-btc-history-qualification'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Capture Stage B one-minute evidence twice
        run: |
          mkdir -p /tmp/sf087-stage-b
          python -m signalforge.research.delta_historical_qualification \
            --resolution 1m --start-epoch 1793232000 --end-epoch 1793318340 \
            --repeats 2 --output-dir /tmp/sf087-stage-b/one-minute

      - name: Capture Stage B matching five-minute evidence
        run: |
          python -m signalforge.research.delta_historical_qualification \
            --resolution 5m --start-epoch 1793232000 --end-epoch 1793318100 \
            --repeats 1 --output-dir /tmp/sf087-stage-b/five-minute

      - name: Upload private qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: sf087-stage-b-${{ github.sha }}
          path: /tmp/sf087-stage-b
          if-no-files-found: error
          retention-days: 7
