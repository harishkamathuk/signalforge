name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.12 validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: signalforge_test
          POSTGRES_USER: signalforge
          POSTGRES_PASSWORD: signalforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalforge -d signalforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://signalforge:signalforge@localhost:5432/signalforge_test
      SIGNALFORGE_DESTRUCTIVE_MIGRATION_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,docs,research]'

      - name: Committed diff whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            git diff --check "$PR_BASE_SHA"...HEAD
          else
            git diff --check HEAD^..HEAD
          fi

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy signalforge

      - name: Build documentation
        run: mkdocs build --strict

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Verify Alembic state
        run: |
          alembic heads
          alembic current
          alembic check

      - name: Provision disposable migration-test database marker
        run: |
          python - <<'PY'
          import os
          import sqlalchemy as sa
          engine = sa.create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as conn:
              name, role = conn.execute(sa.text("SELECT current_database(), current_user")).one()
              assert (name, role) == ("signalforge_test", "signalforge")
              existing = conn.execute(
                  sa.text("SELECT description FROM pg_shdescription WHERE objoid = "
                          "(SELECT oid FROM pg_database WHERE datname = current_database()) "
                          "AND classoid = 'pg_database'::regclass")
              ).scalar_one_or_none()
              assert existing is None, "Test database was not freshly provisioned"
              conn.execute(
                  sa.text("COMMENT ON DATABASE signalforge_test IS "
                          "'signalforge:disposable-migration-tests:v1'")
              )
          PY

      - name: Prove migration tests reject unmarked database
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sqlalchemy as sa
          engine = sa.create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as conn:
              conn.execute(sa.text("COMMENT ON DATABASE signalforge_test IS NULL"))
          result = subprocess.run(
              ["python", "-m", "pytest", "-q",
               "tests/integration/persistence/test_migrations.py",
               "-k", "test_alembic_head_creates_canonical_runtime_schema"],
              capture_output=True, text=True, check=False,
              env={**os.environ, "SIGNALFORGE_DESTRUCTIVE_MIGRATION_TESTS": "1"},
          )
          assert result.returncode != 0, result.stdout + result.stderr
          assert "database is missing disposable marker" in result.stdout, (
              result.stdout + result.stderr
          )
          with engine.begin() as conn:
              revision = conn.execute(
                  sa.text("SELECT version_num FROM alembic_version")
              ).scalar_one()
              assert revision == "20261101_0010", revision
              conn.execute(
                  sa.text("COMMENT ON DATABASE signalforge_test IS "
                          "'signalforge:disposable-migration-tests:v1'")
              )
          print("Unmarked database rejected; schema remained at head")
          PY

      - name: Pytest with coverage
        run: pytest --cov=signalforge --cov-report=term-missing
