name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.12 validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: signalforge_test
          POSTGRES_USER: signalforge
          POSTGRES_PASSWORD: signalforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalforge -d signalforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://signalforge:signalforge@localhost:5432/signalforge_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,docs]'

      - name: Committed diff whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            git diff --check "$PR_BASE_SHA"...HEAD
          else
            git diff --check HEAD^..HEAD
          fi

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy signalforge

      - name: Build documentation
        run: mkdocs build --strict

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Verify Alembic state
        run: |
          alembic heads
          alembic current

      - name: Pytest with coverage
        run: pytest --cov=signalforge --cov-report=term-missing
